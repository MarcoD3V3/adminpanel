# CraftLauncher — despliega el ADMIN (Next.js), NO el launcher Electron.
#
# Variables obligatorias en Railway:
#   LAUNCHER_ADMIN_SECRET, LAUNCHER_TOKEN_PEPPER, LAUNCHER_AUTH_ENFORCE=true
# NO definas HUB_DATA_AUTHORITY_URL en Railway (este servicio es la autoridad de datos).
#
# Volumen persistente: monta en /app/data (hub-layout.json, hub-layouts/, launcher-auth.json…).
[build]
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"

# Segundo servicio: Player Portal (user_web)
# - Root directory en Railway: VACÍO (raíz del repo). NO uses packages/user_web.
# - Build: npm ci && npm run build -w craftlauncher-user-web
# - Start: npm run start -w craftlauncher-user-web
# - Ver también railway.user-web.toml
# - Variables: ADMIN_API_URL, NEXT_PUBLIC_ADMIN_API_URL, PORTAL_CLIPBOARD_SECRET
