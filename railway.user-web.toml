# Player Portal (packages/user_web) — segundo servicio en Railway.
#
# Root directory: packages/user_web (o repo dedicado solo user_web)
# Builder: Dockerfile en packages/user_web
# Start: node server.js  (NO npm run start -w craftlauncher-user-web)
#
# Variables: ADMIN_API_URL, NEXT_PUBLIC_ADMIN_API_URL, PORTAL_CLIPBOARD_SECRET
[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/user_web/Dockerfile"

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
